<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="arDb1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#047857"/></marker>
    <marker id="arDb2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1d4ed8"/></marker>
    <marker id="arDb3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7e22ce"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
    <style>
      .t{font-size:27px;font-weight:800;fill:#0f172a}
      .sub{font-size:14px;fill:#64748b}
      .ct{font-size:17px;font-weight:700}
      .cs{font-size:12.5px;fill:#475569}
      .flow{font-size:12px;font-weight:700;fill:#475569}
      .badge{font-size:13px;font-weight:800;fill:#fff}
      .leg{font-size:12.5px;fill:#334155}
    </style>
  </defs>

  <rect width="1180" height="660" fill="url(#bg)"/>
  <text x="40" y="48" class="t">Arquitetura — CI/CD Finanças</text>
  <text x="40" y="72" class="sub">Commit → Pipeline automatizado → 3 ambientes isolados em Docker</text>

  <!-- 1. DEV LOCAL -->
  <rect x="40" y="104" width="180" height="150" rx="16" fill="#ffffff" stroke="#818cf8" stroke-width="2.5"/>
  <g transform="translate(110,134)" stroke="#4f46e5" stroke-width="2.5" fill="none">
    <rect x="0" y="0" width="50" height="32" rx="3"/><line x1="-8" y1="40" x2="58" y2="40"/>
    <path d="M-8 40 L0 32 L50 32 L58 40" fill="#e0e7ff" stroke="none"/>
  </g>
  <text x="130" y="204" text-anchor="middle" class="ct" fill="#4f46e5">Dev Local</text>
  <text x="130" y="226" text-anchor="middle" class="cs">altera código</text>
  <text x="130" y="244" text-anchor="middle" class="cs">commit + push</text>

  <line x1="222" y1="179" x2="278" y2="179" stroke="#334155" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="250" y="170" text-anchor="middle" class="flow">push</text>

  <!-- 2. GITHUB -->
  <rect x="280" y="104" width="175" height="150" rx="16" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <g transform="translate(345,131)" stroke="#0f172a" stroke-width="2.5" fill="none">
    <circle cx="6" cy="6" r="5" fill="#0f172a"/><circle cx="6" cy="38" r="5" fill="#0f172a"/><circle cx="40" cy="14" r="5" fill="#0f172a"/>
    <line x1="6" y1="11" x2="6" y2="33"/><path d="M6 20 q0 -8 16 -8 l12 0"/>
  </g>
  <text x="367" y="196" text-anchor="middle" class="ct" fill="#0f172a">GitHub</text>
  <text x="367" y="218" text-anchor="middle" class="cs">branch main</text>
  <text x="367" y="236" text-anchor="middle" class="cs">SCM polling 1 min</text>

  <line x1="457" y1="179" x2="513" y2="179" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arG)"/>
  <text x="485" y="170" text-anchor="middle" class="flow" fill="#16a34a">trigger</text>

  <!-- 3. JENKINS -->
  <rect x="515" y="96" width="245" height="168" rx="16" fill="#ffffff" stroke="#0ea5e9" stroke-width="2.5"/>
  <g transform="translate(637,136)" fill="#0369a1">
    <circle cx="0" cy="0" r="15"/><circle cx="0" cy="0" r="6" fill="#ffffff"/>
    <g stroke="#0369a1" stroke-width="6"><line x1="0" y1="-22" x2="0" y2="-15"/><line x1="0" y1="15" x2="0" y2="22"/><line x1="-22" y1="0" x2="-15" y2="0"/><line x1="15" y1="0" x2="22" y2="0"/><line x1="-15" y1="-15" x2="-11" y2="-11"/><line x1="11" y1="11" x2="15" y2="15"/><line x1="15" y1="-15" x2="11" y2="-11"/><line x1="-11" y1="11" x2="-15" y2="15"/></g>
  </g>
  <text x="637" y="182" text-anchor="middle" class="ct" fill="#0369a1">Jenkins CI/CD</text>
  <rect x="535" y="194" width="205" height="58" rx="9" fill="#f0f9ff" stroke="#7dd3fc"/>
  <text x="637" y="216" text-anchor="middle" class="cs" font-weight="700" fill="#0369a1">Pipeline</text>
  <text x="637" y="236" text-anchor="middle" class="cs">lint → 37 testes → build → deploy</text>
  <rect x="694" y="102" width="56" height="22" rx="11" fill="#0ea5e9"/>
  <text x="722" y="118" text-anchor="middle" class="badge" font-size="12">:8082</text>

  <line x1="637" y1="264" x2="637" y2="306" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arG)"/>
  <text x="700" y="290" text-anchor="middle" class="flow" fill="#16a34a">build OK → deploy</text>

  <!-- DOCKER HOST -->
  <rect x="60" y="320" width="1080" height="262" rx="18" fill="#eff6ff" stroke="#2496ed" stroke-width="2.5"/>
  <g transform="translate(82,336)" fill="#2496ed">
    <rect x="0" y="6" width="6" height="6"/><rect x="8" y="6" width="6" height="6"/><rect x="16" y="6" width="6" height="6"/>
    <rect x="8" y="-2" width="6" height="6"/><rect x="16" y="-2" width="6" height="6"/>
    <path d="M-4 14 h34 a10 10 0 0 1 -10 9 h-14 a12 12 0 0 1 -10 -9 z"/>
  </g>
  <text x="124" y="352" class="ct" fill="#2496ed">Docker Host</text>
  <text x="124" y="370" class="cs">VM Linux · 177.44.248.116 · rede financas-network · Jenkins tambem roda aqui</text>

  <!-- ENV: Integracao -->
  <rect x="90" y="392" width="330" height="162" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
  <g transform="translate(112,414)" stroke="#047857" stroke-width="2.5" fill="none"><rect x="0" y="0" width="30" height="24" rx="2"/><line x1="0" y1="8" x2="30" y2="8"/><line x1="10" y1="0" x2="10" y2="24"/></g>
  <text x="156" y="424" class="ct" fill="#047857">Integração</text>
  <rect x="346" y="404" width="56" height="24" rx="12" fill="#10b981"/>
  <text x="374" y="421" text-anchor="middle" class="badge">:3001</text>
  <text x="112" y="460" class="cs">Deploy automático a cada build aprovado</text>
  <g transform="translate(112,490)">
    <rect x="0" y="2" width="34" height="40" rx="4" fill="#ffffff" stroke="#047857" stroke-width="2"/>
    <text x="17" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">app</text>
    <line x1="34" y1="22" x2="74" y2="22" stroke="#047857" stroke-width="2" marker-end="url(#arDb1)"/>
    <g transform="translate(78,4)" stroke="#047857" stroke-width="2"><path d="M0 6 v24 a18 6 0 0 0 36 0 v-24" fill="#d1fae5"/><ellipse cx="18" cy="6" rx="18" ry="6" fill="#a7f3d0"/></g>
    <text x="96" y="29" text-anchor="middle" font-size="10.5" font-weight="700" fill="#047857">SQLite</text>
    <text x="150" y="20" font-size="11" fill="#475569" font-weight="700">volume /data</text>
    <text x="150" y="36" font-size="10" fill="#64748b">integracao-data</text>
  </g>

  <line x1="422" y1="472" x2="466" y2="472" stroke="#334155" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="444" y="463" text-anchor="middle" class="flow">promote</text>

  <!-- ENV: Homologacao -->
  <rect x="468" y="392" width="330" height="162" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
  <g transform="translate(490,414)" stroke="#1d4ed8" stroke-width="2.5" fill="none"><rect x="0" y="0" width="30" height="24" rx="2"/><line x1="0" y1="8" x2="30" y2="8"/><line x1="10" y1="0" x2="10" y2="24"/></g>
  <text x="534" y="424" class="ct" fill="#1d4ed8">Homologação</text>
  <rect x="724" y="404" width="56" height="24" rx="12" fill="#3b82f6"/>
  <text x="752" y="421" text-anchor="middle" class="badge">:3002</text>
  <text x="490" y="460" class="cs">Imagem aprovada, promovida da integração</text>
  <g transform="translate(490,490)">
    <rect x="0" y="2" width="34" height="40" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="17" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">app</text>
    <line x1="34" y1="22" x2="74" y2="22" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arDb2)"/>
    <g transform="translate(78,4)" stroke="#1d4ed8" stroke-width="2"><path d="M0 6 v24 a18 6 0 0 0 36 0 v-24" fill="#dbeafe"/><ellipse cx="18" cy="6" rx="18" ry="6" fill="#bfdbfe"/></g>
    <text x="96" y="29" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1d4ed8">SQLite</text>
    <text x="150" y="20" font-size="11" fill="#475569" font-weight="700">volume /data</text>
    <text x="150" y="36" font-size="10" fill="#64748b">homologacao-data</text>
  </g>

  <line x1="800" y1="472" x2="844" y2="472" stroke="#334155" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="822" y="463" text-anchor="middle" class="flow">promote</text>

  <!-- ENV: Producao -->
  <rect x="846" y="392" width="282" height="162" rx="14" fill="#faf5ff" stroke="#a855f7" stroke-width="2.5"/>
  <g transform="translate(868,414)" fill="#7e22ce"><path d="M14 0 C20 6 22 16 18 24 L10 24 C6 16 8 6 14 0 z"/><circle cx="14" cy="9" r="3" fill="#faf5ff"/><path d="M10 22 l-5 6 l6 -2 z"/><path d="M18 22 l5 6 l-6 -2 z"/></g>
  <text x="908" y="424" class="ct" fill="#7e22ce">Produção</text>
  <rect x="1054" y="404" width="56" height="24" rx="12" fill="#a855f7"/>
  <text x="1082" y="421" text-anchor="middle" class="badge">:3000</text>
  <text x="868" y="460" class="cs">Versão final validada</text>
  <g transform="translate(868,490)">
    <rect x="0" y="2" width="34" height="40" rx="4" fill="#ffffff" stroke="#7e22ce" stroke-width="2"/>
    <text x="17" y="27" text-anchor="middle" font-size="11" font-weight="700" fill="#7e22ce">app</text>
    <line x1="34" y1="22" x2="74" y2="22" stroke="#7e22ce" stroke-width="2" marker-end="url(#arDb3)"/>
    <g transform="translate(78,4)" stroke="#7e22ce" stroke-width="2"><path d="M0 6 v24 a18 6 0 0 0 36 0 v-24" fill="#f3e8ff"/><ellipse cx="18" cy="6" rx="18" ry="6" fill="#e9d5ff"/></g>
    <text x="96" y="29" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7e22ce">SQLite</text>
    <text x="138" y="20" font-size="11" fill="#475569" font-weight="700">volume</text>
    <text x="138" y="36" font-size="10" fill="#64748b">producao-data</text>
  </g>

  <!-- STACK + LEGENDA -->
  <rect x="40" y="600" width="1100" height="42" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="626" class="leg" font-weight="700" fill="#0f172a">Stack:</text>
  <g class="leg" fill="#334155">
    <circle cx="118" cy="622" r="5" fill="#2496ed"/><text x="130" y="626">Docker</text>
    <circle cx="208" cy="622" r="5" fill="#0ea5e9"/><text x="220" y="626">Jenkins</text>
    <circle cx="300" cy="622" r="5" fill="#7c3aed"/><text x="312" y="626">Terraform</text>
    <circle cx="402" cy="622" r="5" fill="#ef4444"/><text x="414" y="626">Ansible</text>
    <circle cx="492" cy="622" r="5" fill="#4b32c3"/><text x="504" y="626">ESLint</text>
    <circle cx="566" cy="622" r="5" fill="#15c213"/><text x="578" y="626">Jest/Vitest</text>
    <circle cx="674" cy="622" r="5" fill="#339933"/><text x="686" y="626">Node 20</text>
    <circle cx="770" cy="622" r="5" fill="#0f80cc"/><text x="782" y="626">SQLite</text>
  </g>
  <line x1="852" y1="622" x2="882" y2="622" stroke="#16a34a" stroke-width="3" marker-end="url(#arG)"/>
  <text x="890" y="626" class="leg">deploy</text>
  <line x1="952" y1="622" x2="982" y2="622" stroke="#334155" stroke-width="3" marker-end="url(#ar)"/>
  <text x="990" y="626" class="leg">promoção</text>
</svg>
