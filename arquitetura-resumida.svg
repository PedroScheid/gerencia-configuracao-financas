<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#f59e0b"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
    <style>
      .t{font-size:28px;font-weight:800;fill:#0f172a}
      .sub{font-size:14px;fill:#64748b}
      .ct{font-size:17px;font-weight:700}
      .cs{font-size:12.5px;fill:#475569}
      .flow{font-size:12px;font-weight:700;fill:#475569}
      .badge{font-size:13px;font-weight:800;fill:#fff}
      .leg{font-size:12.5px;fill:#334155}
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="40" y="50" class="t">Arquitetura — CI/CD Finanças</text>
  <text x="40" y="74" class="sub">Commit → Pipeline automatizado → 3 ambientes isolados em Docker · monitorados pelo Zabbix</text>

  <!-- ============ 1. DEV LOCAL ============ -->
  <rect x="40" y="108" width="180" height="150" rx="16" fill="#ffffff" stroke="#818cf8" stroke-width="2.5"/>
  <!-- laptop icon -->
  <g transform="translate(110,138)" stroke="#4f46e5" stroke-width="2.5" fill="none">
    <rect x="0" y="0" width="50" height="32" rx="3"/>
    <line x1="-8" y1="40" x2="58" y2="40"/>
    <path d="M-8 40 L0 32 L50 32 L58 40" fill="#e0e7ff" stroke="none"/>
  </g>
  <text x="130" y="208" text-anchor="middle" class="ct" fill="#4f46e5">Dev Local</text>
  <text x="130" y="230" text-anchor="middle" class="cs">altera código</text>
  <text x="130" y="248" text-anchor="middle" class="cs">commit + push</text>

  <line x1="222" y1="183" x2="278" y2="183" stroke="#334155" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="250" y="174" text-anchor="middle" class="flow">push</text>

  <!-- ============ 2. GITHUB ============ -->
  <rect x="280" y="108" width="175" height="150" rx="16" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <!-- git branch icon -->
  <g transform="translate(345,135)" stroke="#0f172a" stroke-width="2.5" fill="none">
    <circle cx="6" cy="6" r="5" fill="#0f172a"/>
    <circle cx="6" cy="38" r="5" fill="#0f172a"/>
    <circle cx="40" cy="14" r="5" fill="#0f172a"/>
    <line x1="6" y1="11" x2="6" y2="33"/>
    <path d="M6 20 q0 -8 16 -8 l12 0"/>
  </g>
  <text x="367" y="200" text-anchor="middle" class="ct" fill="#0f172a">GitHub</text>
  <text x="367" y="222" text-anchor="middle" class="cs">branch main</text>
  <text x="367" y="240" text-anchor="middle" class="cs">SCM polling 1 min</text>

  <line x1="457" y1="183" x2="513" y2="183" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arG)"/>
  <text x="485" y="174" text-anchor="middle" class="flow" fill="#16a34a">trigger</text>

  <!-- ============ 3. JENKINS ============ -->
  <rect x="515" y="100" width="245" height="168" rx="16" fill="#ffffff" stroke="#0ea5e9" stroke-width="2.5"/>
  <!-- gear icon -->
  <g transform="translate(637,140)" fill="#0369a1">
    <circle cx="0" cy="0" r="15"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
    <g stroke="#0369a1" stroke-width="6"><line x1="0" y1="-22" x2="0" y2="-15"/><line x1="0" y1="15" x2="0" y2="22"/><line x1="-22" y1="0" x2="-15" y2="0"/><line x1="15" y1="0" x2="22" y2="0"/><line x1="-15" y1="-15" x2="-11" y2="-11"/><line x1="11" y1="11" x2="15" y2="15"/><line x1="15" y1="-15" x2="11" y2="-11"/><line x1="-11" y1="11" x2="-15" y2="15"/></g>
  </g>
  <text x="637" y="186" text-anchor="middle" class="ct" fill="#0369a1">Jenkins CI/CD</text>
  <rect x="535" y="198" width="205" height="58" rx="9" fill="#f0f9ff" stroke="#7dd3fc"/>
  <text x="637" y="220" text-anchor="middle" class="cs" font-weight="700" fill="#0369a1">Pipeline</text>
  <text x="637" y="240" text-anchor="middle" class="cs">lint → 37 testes → build → deploy</text>
  <rect x="694" y="106" width="56" height="22" rx="11" fill="#0ea5e9"/>
  <text x="722" y="122" text-anchor="middle" class="badge" font-size="12">:8082</text>

  <line x1="637" y1="268" x2="637" y2="316" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arG)"/>
  <text x="700" y="296" text-anchor="middle" class="flow" fill="#16a34a">build OK → deploy</text>

  <!-- ============ DOCKER HOST ============ -->
  <rect x="60" y="328" width="945" height="262" rx="18" fill="#eff6ff" stroke="#2496ed" stroke-width="2.5"/>
  <!-- docker whale (simplified) -->
  <g transform="translate(82,344)" fill="#2496ed">
    <rect x="0" y="6" width="6" height="6"/><rect x="8" y="6" width="6" height="6"/><rect x="16" y="6" width="6" height="6"/>
    <rect x="8" y="-2" width="6" height="6"/><rect x="16" y="-2" width="6" height="6"/>
    <path d="M-4 14 h34 a10 10 0 0 1 -10 9 h-14 a12 12 0 0 1 -10 -9 z"/>
  </g>
  <text x="124" y="360" class="ct" fill="#2496ed">Docker Host</text>
  <text x="124" y="378" class="cs">VM Linux · 177.44.248.116 · rede financas-network</text>

  <!-- ENV: Integração -->
  <rect x="90" y="398" width="272" height="162" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
  <!-- container box icon -->
  <g transform="translate(112,420)" stroke="#047857" stroke-width="2.5" fill="none"><rect x="0" y="0" width="30" height="24" rx="2"/><line x1="0" y1="8" x2="30" y2="8"/><line x1="10" y1="0" x2="10" y2="24"/></g>
  <text x="156" y="430" class="ct" fill="#047857">Integração</text>
  <rect x="288" y="410" width="56" height="24" rx="12" fill="#10b981"/>
  <text x="316" y="427" text-anchor="middle" class="badge">:3001</text>
  <text x="112" y="468" class="cs">Deploy automático</text>
  <text x="112" y="488" class="cs">a cada build aprovado</text>
  <text x="112" y="526" class="cs" font-weight="700" fill="#047857">container + volume</text>
  <text x="112" y="544" class="cs">financas-integracao-data</text>

  <line x1="364" y1="478" x2="408" y2="478" stroke="#334155" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="386" y="469" text-anchor="middle" class="flow">promote</text>

  <!-- ENV: Homologação -->
  <rect x="410" y="398" width="272" height="162" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
  <g transform="translate(432,420)" stroke="#1d4ed8" stroke-width="2.5" fill="none"><rect x="0" y="0" width="30" height="24" rx="2"/><line x1="0" y1="8" x2="30" y2="8"/><line x1="10" y1="0" x2="10" y2="24"/></g>
  <text x="476" y="430" class="ct" fill="#1d4ed8">Homologação</text>
  <rect x="608" y="410" width="56" height="24" rx="12" fill="#3b82f6"/>
  <text x="636" y="427" text-anchor="middle" class="badge">:3002</text>
  <text x="432" y="468" class="cs">Imagem aprovada</text>
  <text x="432" y="488" class="cs">promovida da integração</text>
  <text x="432" y="526" class="cs" font-weight="700" fill="#1d4ed8">container + volume</text>
  <text x="432" y="544" class="cs">financas-homologacao-data</text>

  <line x1="684" y1="478" x2="728" y2="478" stroke="#334155" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="706" y="469" text-anchor="middle" class="flow">promote</text>

  <!-- ENV: Produção -->
  <rect x="730" y="398" width="252" height="162" rx="14" fill="#faf5ff" stroke="#a855f7" stroke-width="2.5"/>
  <!-- rocket icon -->
  <g transform="translate(752,420)" fill="#7e22ce"><path d="M14 0 C20 6 22 16 18 24 L10 24 C6 16 8 6 14 0 z"/><circle cx="14" cy="9" r="3" fill="#faf5ff"/><path d="M10 22 l-5 6 l6 -2 z"/><path d="M18 22 l5 6 l-6 -2 z"/></g>
  <text x="792" y="430" class="ct" fill="#7e22ce">Produção</text>
  <rect x="910" y="410" width="56" height="24" rx="12" fill="#a855f7"/>
  <text x="938" y="427" text-anchor="middle" class="badge">:3000</text>
  <text x="752" y="468" class="cs">Versão final</text>
  <text x="752" y="488" class="cs">validada nos 2 anteriores</text>
  <text x="752" y="526" class="cs" font-weight="700" fill="#7e22ce">container + volume</text>
  <text x="752" y="544" class="cs">financas-producao-data</text>

  <!-- ============ ZABBIX ============ -->
  <rect x="1030" y="328" width="210" height="262" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
  <!-- chart icon -->
  <g transform="translate(1108,360)" fill="#b45309"><rect x="0" y="22" width="9" height="16"/><rect x="14" y="10" width="9" height="28"/><rect x="28" y="0" width="9" height="38"/></g>
  <text x="1135" y="416" text-anchor="middle" class="ct" fill="#b45309">Zabbix</text>
  <rect x="1182" y="336" width="52" height="22" rx="11" fill="#f59e0b"/>
  <text x="1208" y="352" text-anchor="middle" class="badge" font-size="12">:8080</text>
  <text x="1135" y="446" text-anchor="middle" class="cs">Monitoramento</text>
  <text x="1135" y="478" text-anchor="middle" class="cs">CPU · memória</text>
  <text x="1135" y="498" text-anchor="middle" class="cs">disco · rede</text>
  <text x="1135" y="530" text-anchor="middle" class="cs" font-weight="700" fill="#b45309">em tempo real</text>

  <path d="M1030 459 L1006 459" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arO)"/>
  <text x="1018" y="449" text-anchor="middle" class="flow" fill="#b45309">monitora</text>

  <!-- ============ STACK + LEGENDA ============ -->
  <rect x="40" y="618" width="1200" height="74" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="645" class="leg" font-weight="700" fill="#0f172a">Stack:</text>
  <g class="leg" fill="#334155">
    <circle cx="118" cy="641" r="5" fill="#2496ed"/><text x="130" y="645">Docker</text>
    <circle cx="208" cy="641" r="5" fill="#0ea5e9"/><text x="220" y="645">Jenkins</text>
    <circle cx="300" cy="641" r="5" fill="#7c3aed"/><text x="312" y="645">Terraform</text>
    <circle cx="402" cy="641" r="5" fill="#ef4444"/><text x="414" y="645">Ansible</text>
    <circle cx="492" cy="641" r="5" fill="#f59e0b"/><text x="504" y="645">Zabbix</text>
    <circle cx="578" cy="641" r="5" fill="#4b32c3"/><text x="590" y="645">ESLint</text>
    <circle cx="664" cy="641" r="5" fill="#15c213"/><text x="676" y="645">Jest/Vitest</text>
    <circle cx="772" cy="641" r="5" fill="#339933"/><text x="784" y="645">Node 20</text>
    <circle cx="868" cy="641" r="5" fill="#0f80cc"/><text x="880" y="645">SQLite</text>
  </g>

  <text x="60" y="675" class="leg">Fluxo:</text>
  <line x1="106" y1="671" x2="136" y2="671" stroke="#16a34a" stroke-width="3" marker-end="url(#arG)"/>
  <text x="144" y="675" class="leg">build / deploy</text>
  <line x1="248" y1="671" x2="278" y2="671" stroke="#334155" stroke-width="3" marker-end="url(#ar)"/>
  <text x="286" y="675" class="leg">promoção entre ambientes</text>
  <line x1="470" y1="671" x2="500" y2="671" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arO)"/>
  <text x="508" y="675" class="leg">monitoramento (Zabbix)</text>
</svg>
