<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1080" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ea580c"/>
    </marker>
    <style>
      .title{font-size:30px;font-weight:700;fill:#0f172a}
      .sub{font-size:15px;fill:#64748b}
      .layer{font-size:17px;font-weight:700;fill:#1e293b}
      .box-title{font-size:16px;font-weight:700;fill:#0f172a}
      .box-sub{font-size:12.5px;fill:#475569}
      .small{font-size:12px;fill:#475569}
      .tag{font-size:11px;font-weight:600;fill:#334155}
      .lbl{font-size:12.5px;font-weight:600;fill:#475569}
      .stage{font-size:13px;font-weight:600;fill:#1e293b}
    </style>
  </defs>

  <rect width="1480" height="1080" fill="#f8fafc"/>

  <!-- Header -->
  <text x="40" y="48" class="title">Arquitetura — Gerência de Configuração / Finanças</text>
  <text x="40" y="74" class="sub">CI/CD com Jenkins · Infraestrutura como Código (Terraform + Ansible) · Docker · Monitoramento Zabbix · 3 ambientes</text>

  <!-- ============ LAYER 1: DEV LOCAL ============ -->
  <rect x="40" y="100" width="1400" height="150" rx="14" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="62" y="128" class="layer">1 · Máquina Local do Desenvolvedor</text>

  <rect x="62" y="142" width="280" height="92" rx="10" fill="#ffffff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="80" y="168" class="box-title">Alterações no código</text>
  <text x="80" y="190" class="box-sub">• backend/src/index.ts (lint)</text>
  <text x="80" y="208" class="box-sub">• frontend/src/index.css (cor)</text>
  <text x="80" y="226" class="box-sub">• migrations/002_create_categorias.sql</text>

  <rect x="372" y="142" width="240" height="92" rx="10" fill="#ffffff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="390" y="168" class="box-title">Git — commit único</text>
  <text x="390" y="190" class="box-sub">git add . &amp;&amp; git commit</text>
  <text x="390" y="208" class="box-sub">git push origin main</text>
  <text x="390" y="226" class="small">Um push dispara o pipeline</text>

  <rect x="642" y="142" width="230" height="92" rx="10" fill="#ffffff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="660" y="168" class="box-title">GitHub</text>
  <text x="660" y="190" class="box-sub">PedroScheid/</text>
  <text x="660" y="208" class="box-sub">gerencia-configuracao-financas</text>
  <text x="660" y="226" class="small">Repositório remoto (main)</text>

  <!-- IaC box on the right of layer 1 -->
  <rect x="902" y="142" width="518" height="92" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="920" y="168" class="box-title" fill="#9a3412">Infraestrutura como Código (provisiona a VM)</text>
  <text x="920" y="192" class="box-sub">Ansible — playbook.yml: Docker, Terraform, Node, Git, firewall (UFW)</text>
  <text x="920" y="212" class="box-sub">Terraform — main.tf: cria containers Jenkins + Zabbix + rede + volumes</text>
  <text x="920" y="230" class="small">scripts/setup-vm.sh orquestra tudo no provisionamento</text>

  <!-- arrows layer 1 -->
  <line x1="342" y1="188" x2="368" y2="188" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="612" y1="188" x2="638" y2="188" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- push to Jenkins -->
  <path d="M757 234 L757 290" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="767" y="268" class="lbl" fill="#16a34a">push → trigger automático (webhook / SCM polling)</text>

  <!-- ============ LAYER 2: VM / DOCKER HOST ============ -->
  <rect x="40" y="300" width="1400" height="720" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="62" y="328" class="layer">2 · VM Linux — 177.44.248.116  ·  Docker Host (rede: financas-network)</text>

  <!-- ===== Jenkins CI/CD block ===== -->
  <rect x="62" y="346" width="660" height="340" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="82" y="374" class="box-title" fill="#075985">Jenkins — CI/CD  (container, porta 8082)</text>
  <text x="82" y="394" class="small">Docker CLI + Node 20 instalados no container · monta /repo (read-only)</text>

  <!-- pipeline stages -->
  <rect x="82" y="408" width="600" height="120" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="98" y="430" class="stage" fill="#075985">Pipeline (Jenkinsfile)</text>

  <!-- stage chips -->
  <rect x="98" y="442" width="92" height="64" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="144" y="466" text-anchor="middle" class="tag">Checkout</text>
  <text x="144" y="484" text-anchor="middle" class="small">rsync /repo</text>

  <rect x="198" y="442" width="150" height="64" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="273" y="462" text-anchor="middle" class="tag">Install &amp; Quality</text>
  <text x="273" y="479" text-anchor="middle" class="small">back + front paralelo</text>
  <text x="273" y="496" text-anchor="middle" class="small">lint · test · build</text>

  <rect x="356" y="442" width="120" height="64" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="416" y="466" text-anchor="middle" class="tag">Build Docker</text>
  <text x="416" y="484" text-anchor="middle" class="small">financas-app</text>

  <rect x="484" y="442" width="182" height="64" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="575" y="466" text-anchor="middle" class="tag" fill="#15803d">Deploy Integração</text>
  <text x="575" y="484" text-anchor="middle" class="small">docker run → :3001</text>

  <!-- stage connectors -->
  <line x1="190" y1="474" x2="196" y2="474" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="348" y1="474" x2="354" y2="474" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="476" y1="474" x2="482" y2="474" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- quality gate -->
  <rect x="82" y="540" width="290" height="62" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="98" y="562" class="box-title" fill="#b91c1c" font-size="14">Quality Gate</text>
  <text x="98" y="582" class="small">ESLint (camelCase) · 37 testes (Jest+Vitest)</text>
  <text x="98" y="598" class="small">Falhou → pipeline interrompe, nenhum deploy</text>
  <path d="M227 540 L227 528 L575 528 L575 514" stroke="#dc2626" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <text x="237" y="524" class="lbl" fill="#dc2626">bloqueia se falhar</text>

  <!-- test report -->
  <rect x="392" y="540" width="290" height="62" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="408" y="562" class="box-title" fill="#15803d" font-size="14">Test Report (JUnit)</text>
  <text x="408" y="582" class="small">backend/frontend test-results.xml</text>
  <text x="408" y="598" class="small">37 testes visíveis no Jenkins</text>

  <!-- jenkins volume -->
  <rect x="82" y="616" width="600" height="54" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="98" y="638" class="box-title" font-size="14" fill="#1d4ed8">Volumes Docker</text>
  <text x="98" y="658" class="small">jenkins-data · /var/run/docker.sock (host) montado no Jenkins</text>

  <!-- ===== AMBIENTES (3) ===== -->
  <text x="752" y="368" class="layer" font-size="16">Ambientes da Aplicação (containers Docker)</text>

  <!-- Integração -->
  <rect x="752" y="382" width="668" height="92" rx="11" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="772" y="408" class="box-title" fill="#047857">Integração — financas-integracao</text>
  <text x="772" y="430" class="box-sub">Porta :3001 · NODE_ENV=integration</text>
  <text x="772" y="450" class="small">Deploy automático pelo pipeline · volume financas-integracao-data</text>
  <text x="772" y="468" class="small">Migrations aplicadas no start (002 cria tabela categorias)</text>

  <!-- Homologação -->
  <rect x="752" y="486" width="668" height="92" rx="11" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="772" y="512" class="box-title" fill="#1d4ed8">Homologação — financas-homologacao</text>
  <text x="772" y="534" class="box-sub">Porta :3002 · NODE_ENV=homologation</text>
  <text x="772" y="554" class="small">Sobe via promote-homolog (Terraform) · volume financas-homologacao-data</text>
  <text x="772" y="572" class="small">Recebe a imagem aprovada na integração (tag homolog)</text>

  <!-- Produção -->
  <rect x="752" y="590" width="668" height="92" rx="11" fill="#fdf4ff" stroke="#c084fc" stroke-width="2"/>
  <text x="772" y="616" class="box-title" fill="#7e22ce">Produção — financas-producao</text>
  <text x="772" y="638" class="box-sub">Porta :3000 · NODE_ENV=production</text>
  <text x="772" y="658" class="small">Sobe via promote-prod (Terraform) · volume financas-producao-data</text>
  <text x="772" y="676" class="small">Só chega o que passou por integração e homologação</text>

  <!-- arrow jenkins deploy -> integração -->
  <path d="M666 474 C710 474 712 428 748 428" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="676" y="466" class="lbl" fill="#16a34a">deploy</text>

  <!-- promote arrows integ -> homolog -> prod -->
  <path d="M1086 474 L1086 482" stroke="#0ea5e9" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="1096" y="482" class="lbl" fill="#0369a1">promote-homolog.bat</text>
  <path d="M1086 578 L1086 586" stroke="#0ea5e9" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="1096" y="586" class="lbl" fill="#0369a1">promote-prod.bat</text>

  <!-- ===== ZABBIX monitoring ===== -->
  <rect x="62" y="700" width="660" height="300" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="82" y="728" class="box-title" fill="#b45309">Zabbix — Monitoramento (stack de containers)</text>

  <rect x="82" y="744" width="300" height="70" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="98" y="768" class="box-title" font-size="14">zabbix-web (:8080)</text>
  <text x="98" y="788" class="small">Interface nginx · login Admin/zabbix</text>
  <text x="98" y="806" class="small">Monitoring → Hosts → Latest data</text>

  <rect x="396" y="744" width="310" height="70" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="412" y="768" class="box-title" font-size="14">zabbix-server (:10051)</text>
  <text x="412" y="788" class="small">Coleta e processa métricas</text>
  <text x="412" y="806" class="small">depends_on postgres</text>

  <rect x="82" y="828" width="300" height="70" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="98" y="852" class="box-title" font-size="14">zabbix-agent</text>
  <text x="98" y="872" class="small">CPU · memória · disco · rede</text>
  <text x="98" y="890" class="small">monta docker.sock (read-only)</text>

  <rect x="396" y="828" width="310" height="70" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="412" y="852" class="box-title" font-size="14">zabbix-postgres</text>
  <text x="412" y="872" class="small">PostgreSQL 15 (banco do Zabbix)</text>
  <text x="412" y="890" class="small">volume zabbix-db-data</text>

  <!-- internal zabbix links -->
  <line x1="382" y1="779" x2="394" y2="779" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="551" y1="814" x2="551" y2="826" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="232" y1="814" x2="232" y2="826" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="82" y="930" class="small" fill="#92400e">O agente observa o host Docker e os containers da aplicação (CPU, memória, disco, rede) em tempo real.</text>
  <text x="82" y="952" class="small" fill="#92400e">Provisionado junto com o Jenkins pelo Terraform no setup — não vem pré-instalado.</text>

  <!-- zabbix observes envs -->
  <path d="M722 760 C736 760 736 528 748 528" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-dasharray="6 5" marker-end="url(#arrowOrange)"/>
  <text x="726" y="520" class="lbl" fill="#b45309">monitora os ambientes ►</text>

  <!-- ===== STACK TECNOLÓGICA box bottom-right ===== -->
  <rect x="752" y="700" width="668" height="300" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="772" y="728" class="box-title">Stack Tecnológica</text>

  <rect x="772" y="742" width="200" height="56" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="788" y="766" class="tag">Docker</text>
  <text x="788" y="785" class="small">Containerização</text>

  <rect x="986" y="742" width="200" height="56" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="1002" y="766" class="tag">Jenkins</text>
  <text x="1002" y="785" class="small">Pipeline CI/CD</text>

  <rect x="1200" y="742" width="200" height="56" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="1216" y="766" class="tag">Terraform</text>
  <text x="1216" y="785" class="small">IaC — provisiona</text>

  <rect x="772" y="810" width="200" height="56" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="788" y="834" class="tag">Ansible</text>
  <text x="788" y="853" class="small">Provisiona a VM</text>

  <rect x="986" y="810" width="200" height="56" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="1002" y="834" class="tag">Zabbix</text>
  <text x="1002" y="853" class="small">Monitoramento</text>

  <rect x="1200" y="810" width="200" height="56" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="1216" y="834" class="tag">ESLint</text>
  <text x="1216" y="853" class="small">Quality gate</text>

  <rect x="772" y="878" width="200" height="56" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="788" y="902" class="tag">Jest / Vitest</text>
  <text x="788" y="921" class="small">37 testes</text>

  <rect x="986" y="878" width="200" height="56" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="1002" y="902" class="tag">Node.js 20</text>
  <text x="1002" y="921" class="small">Backend + Frontend</text>

  <rect x="1200" y="878" width="200" height="56" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="1216" y="902" class="tag">SQLite</text>
  <text x="1216" y="921" class="small">Banco por ambiente</text>

  <text x="772" y="968" class="small">Aplicação: financas-app (imagem única) · cada ambiente é um container isolado com volume de dados próprio.</text>
  <text x="772" y="988" class="small">Fluxo de promoção: Integração → Homologação → Produção (mesma imagem aprovada).</text>

  <!-- Legend -->
  <rect x="1040" y="248" width="380" height="44" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <line x1="1056" y1="262" x2="1086" y2="262" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="1092" y="266" class="small">fluxo OK / deploy</text>
  <line x1="1230" y1="262" x2="1260" y2="262" stroke="#dc2626" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <text x="1266" y="266" class="small">bloqueio (gate)</text>
  <line x1="1056" y1="282" x2="1086" y2="282" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrowOrange)"/>
  <text x="1092" y="286" class="small">monitoramento (Zabbix)</text>
</svg>
