---
- name: Provisionar VM para CI/CD
  hosts: local
  become: yes

  vars:
    node_version: "20"

  tasks:
    # ── Docker ─────────────────────────────────────────────
    - name: Verificar se Docker ja esta instalado
      command: docker --version
      register: docker_check
      ignore_errors: yes
      changed_when: false

    - name: Instalar Docker (se necessario)
      shell: curl -fsSL https://get.docker.com | sh
      when: docker_check.rc != 0

    - name: Habilitar e iniciar Docker
      systemd:
        name: docker
        enabled: yes
        state: started
      ignore_errors: yes

    # ── Terraform ──────────────────────────────────────────
    - name: Verificar se Terraform ja esta instalado
      command: terraform version
      register: terraform_check
      ignore_errors: yes
      changed_when: false

    - name: Instalar unzip
      apt:
        name: unzip
        state: present
      when: terraform_check.rc != 0

    - name: Baixar e instalar Terraform
      shell: |
        curl -fsSL "https://releases.hashicorp.com/terraform/1.7.0/terraform_1.7.0_linux_amd64.zip" -o /tmp/terraform.zip
        unzip -o /tmp/terraform.zip -d /usr/local/bin/
        rm -f /tmp/terraform.zip
      when: terraform_check.rc != 0

    # ── Node.js ────────────────────────────────────────────
    - name: Verificar se Node.js ja esta instalado
      command: node --version
      register: node_check
      ignore_errors: yes
      changed_when: false

    - name: Instalar Node.js
      shell: |
        curl -fsSL https://deb.nodesource.com/setup_{{ node_version }}.x | bash -
        apt-get install -y nodejs
      when: node_check.rc != 0

    # ── Git ────────────────────────────────────────────────
    - name: Instalar Git
      apt:
        name: git
        state: present

    # ── Firewall ───────────────────────────────────────────
    - name: Configurar UFW - permitir portas
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"
        - "3000"
        - "3001"
        - "3002"
        - "8080"
        - "8082"
        - "10051"
      ignore_errors: yes

    # ── Resumo ─────────────────────────────────────────────
    - name: Verificar versoes instaladas
      shell: |
        echo "Docker: $(docker --version 2>/dev/null || echo 'N/A')"
        echo "Terraform: $(terraform version 2>/dev/null | head -1 || echo 'N/A')"
        echo "Node.js: $(node --version 2>/dev/null || echo 'N/A')"
        echo "Git: $(git --version 2>/dev/null || echo 'N/A')"
      register: versions
      changed_when: false

    - name: Exibir resumo
      debug:
        msg: "{{ versions.stdout_lines }}"
