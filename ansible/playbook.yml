---
- name: Provisionar VM para CI/CD
  hosts: local
  become: yes

  vars:
    docker_compose_version: "2.24.0"
    terraform_version: "1.7.0"
    node_version: "20"

  tasks:
    # ── Docker ─────────────────────────────────────────────
    - name: Instalar dependências do Docker
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - software-properties-common
        state: present
        update_cache: yes

    - name: Adicionar chave GPG do Docker
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Adicionar repositório Docker
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Instalar Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Adicionar usuário ao grupo docker
      user:
        name: "{{ ansible_user_id }}"
        groups: docker
        append: yes

    - name: Habilitar e iniciar Docker
      systemd:
        name: docker
        enabled: yes
        state: started

    # ── Terraform ──────────────────────────────────────────
    - name: Verificar se Terraform já está instalado
      command: terraform version
      register: terraform_check
      ignore_errors: yes
      changed_when: false

    - name: Baixar Terraform
      get_url:
        url: "https://releases.hashicorp.com/terraform/{{ terraform_version }}/terraform_{{ terraform_version }}_linux_amd64.zip"
        dest: /tmp/terraform.zip
      when: terraform_check.rc != 0

    - name: Instalar unzip
      apt:
        name: unzip
        state: present
      when: terraform_check.rc != 0

    - name: Descompactar Terraform
      unarchive:
        src: /tmp/terraform.zip
        dest: /usr/local/bin/
        remote_src: yes
      when: terraform_check.rc != 0

    # ── Node.js ────────────────────────────────────────────
    - name: Verificar se Node.js já está instalado
      command: node --version
      register: node_check
      ignore_errors: yes
      changed_when: false

    - name: Instalar Node.js {{ node_version }}
      shell: |
        curl -fsSL https://deb.nodesource.com/setup_{{ node_version }}.x | bash -
        apt-get install -y nodejs
      when: node_check.rc != 0

    # ── Git ────────────────────────────────────────────────
    - name: Instalar Git
      apt:
        name: git
        state: present

    # ── Firewall ───────────────────────────────────────────
    - name: Configurar UFW - permitir portas
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"     # SSH
        - "3000"   # Produção
        - "3001"   # Integração
        - "3002"   # Homologação
        - "8080"   # Zabbix
        - "8082"   # Jenkins
        - "10051"  # Zabbix Agent

    - name: Habilitar UFW
      ufw:
        state: enabled
        policy: allow

    # ── Diretório do projeto ───────────────────────────────
    - name: Criar diretório do projeto
      file:
        path: /home/{{ ansible_user_id }}/financas
        state: directory
        owner: "{{ ansible_user_id }}"
        mode: '0755'

    - name: Exibir resumo
      debug:
        msg: |
          ═══════════════════════════════════════════════
          VM provisionada com sucesso!
          - Docker: instalado
          - Terraform: instalado
          - Node.js: v{{ node_version }}
          - Git: instalado
          - Firewall: configurado
          ═══════════════════════════════════════════════
